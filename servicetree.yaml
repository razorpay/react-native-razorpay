service: react-native-razorpay  # required, canonical slug — immutable once registered
displayName: "React Native Razorpay"  # README title "# react-native-razorpay"; published on npm as react-native-razorpay
description: "Razorpay's public React Native SDK — a wrapper around the native Android and iOS checkout SDKs, published to npm as react-native-razorpay for merchants' mobile apps."  # README ("React Native wrapper around our Android and iOS mobile SDKs", npm package react-native-razorpay with example SampleProject)
type: library  # a client-side SDK published to npm — no server deployment by definition; per brief, SDKs type as library · retype after the serviceTypes enum widens: mobile
tier: T1  # customer-facing: it ships inside merchants' production mobile apps on the payment path, so a broken release degrades checkout for end customers; no server blast radius of its own, so not T0
lifecycle: live  # actively maintained public SDK (last push 2026-08-31, published npm package)
aliases: ["react-native-razorpay-sdk"]  # commonly referred to as the react-native SDK; npm package name react-native-razorpay matches the repo

domain: payment-methods/checkout-sdk  # family payment-methods — checkout SDKs live under payment-methods/checkout-sdk in the merged manifests (3 services); the registry team is PG Growth — TO VERIFY: miss_seed l1 gave payments-platform; the SDK's function matches payment-methods/checkout-sdk, confirm family with the PG Growth POD lead

